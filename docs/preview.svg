<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">GAONA-HUB 0.6 — chat Codex con HUD de compactación</title>
  <desc id="desc">Vista de muestra de una terminal oscura. El HUD usa reglas finas y muestra una animación convergente al compactar contexto.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24404a" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#0e171e"/>
      <stop offset="1" stop-color="#080e13"/>
    </linearGradient>
    <linearGradient id="footer" x2="1">
      <stop stop-color="#142832"/>
      <stop offset="1" stop-color="#0d171e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#40d8f4" stop-opacity=".12"/>
      <stop offset="1" stop-color="#40d8f4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="860" fill="#080d12"/>
  <rect width="1600" height="860" fill="url(#grid)"/>
  <ellipse cx="1260" cy="100" rx="450" ry="280" fill="url(#glow)"/>

  <g font-family="Cascadia Code, Consolas, monospace">
    <path d="M57 40 69 28 81 40 69 52Z" fill="none" stroke="#60dcf5" stroke-width="1.4"/>
    <path d="M64 40h10M69 35v10" stroke="#60dcf5" stroke-width="1"/>
    <text x="94" y="45" fill="#d6e4e9" font-size="15" font-weight="700" letter-spacing="2">GAONA-HUB</text>
    <text x="248" y="45" fill="#72909a" font-size="11" letter-spacing="1.5">V0.6.0 · CODEX INTEGRADO</text>
    <text x="1540" y="44" text-anchor="end" fill="#78909a" font-size="10" letter-spacing="1.2">VISTA DE MUESTRA · DATOS SIMULADOS</text>
  </g>

  <rect x="48" y="81" width="1504" height="728" rx="4" fill="url(#panel)" stroke="#2a3b44"/>
  <path d="M49 82h1502" stroke="#60dcf5" stroke-opacity=".68"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="10" letter-spacing="1.2">
    <text x="76" y="111" fill="#748a94">SESIÓN · CODEX CLI</text>
    <circle cx="1480" cy="107" r="3" fill="#83e6bb"/>
    <text x="1494" y="111" fill="#83e6bb">CONECTADO</text>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="15">
    <text x="100" y="172" fill="#71868f">PS C:\proyecto\gaona-hub&gt; codex</text>
    <text x="100" y="222" fill="#60dcf5">›</text>
    <text x="122" y="222" fill="#dce8ec">Revisa el flujo de contexto y deja el footer más limpio.</text>
    <text x="100" y="267" fill="#c1d0d5">Voy a revisar las señales y el render del HUD.</text>
    <text x="100" y="292" fill="#c1d0d5">Después propongo un cambio acotado.</text>
    <text x="100" y="345" fill="#7f959e">Leyendo src/signals.js · src/terminal-view.js</text>
    <text x="100" y="391" fill="#a9d9c0">El título queda libre de barras; el estado conserva su etiqueta.</text>
  </g>

  <g transform="translate(94 435)">
    <rect width="1412" height="116" rx="3" fill="#0c171d" stroke="#29505d"/>
    <path d="M0 0h1412" stroke="#60dcf5" stroke-opacity=".45"/>
    <text x="24" y="31" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bfeef5">• Compacting context (00:04 • esc to interrupt)</text>
    <text x="24" y="57" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#77949f">└ Making room to continue.</text>
    <path d="M842 84H1026M842 91H1004M842 98H987" stroke="#4b9bac" stroke-opacity=".65" stroke-width="2"/>
    <path d="M1190 84h-164M1174 91h-170M1158 98h-171" stroke="#4b9bac" stroke-opacity=".65" stroke-width="2"/>
    <circle cx="1019" cy="91" r="13" fill="#0c171d" stroke="#60dcf5" stroke-width="1.5" filter="url(#softGlow)"/>
    <circle cx="1019" cy="91" r="3" fill="#c5f7fc"/>
    <text x="1242" y="96" font-family="Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="1" fill="#bdeaf0">COMPACTANDO</text>
  </g>

  <rect x="49" y="655" width="1502" height="153" fill="url(#footer)"/>
  <path d="M49 655h1502" stroke="#2b4853"/>
  <g font-family="Cascadia Code, Consolas, monospace">
    <text x="84" y="693" fill="#9bb3bc" font-size="11" font-weight="700" letter-spacing="1.4">GAONA</text>
    <path d="M164 678v21" stroke="#416370"/>
    <text x="185" y="693" fill="#d5e4e9" font-size="12">Ajustes al HUD de contexto</text>
    <path d="M415 689h1028" stroke="#37788a" stroke-opacity=".62"/>
    <g transform="translate(84 731)">
      <text fill="#708894" font-size="9" letter-spacing="1.2">CTX</text>
      <text y="23" fill="#60dcf5" font-size="13">68%</text>
      <text x="174" fill="#708894" font-size="9" letter-spacing="1.2">TOKEN</text>
      <text x="174" y="23" fill="#c5d7dc" font-size="13">42.8K</text>
      <text x="348" fill="#708894" font-size="9" letter-spacing="1.2">MODELO</text>
      <text x="348" y="23" fill="#c5d7dc" font-size="13">gpt-6-astra · medium</text>
      <text x="720" fill="#708894" font-size="9" letter-spacing="1.2">PROYECTO</text>
      <text x="720" y="23" fill="#c5d7dc" font-size="13">gaona-hub</text>
      <text x="944" fill="#708894" font-size="9" letter-spacing="1.2">ESTADO</text>
      <circle cx="949" cy="18" r="3" fill="#60dcf5" filter="url(#softGlow)"/>
      <text x="963" y="23" fill="#c5f2f7" font-size="13">‹‹◉›› COMPACTANDO</text>
    </g>
    <text x="84" y="787" fill="#5d727c" font-size="9" letter-spacing="1">REGLAS FINAS · SIN RELLENO DIAGONAL · ANIMACIÓN ACTIVADA POR LA SEÑAL TUI DE CODEX</text>
    <text x="1515" y="787" text-anchor="end" fill="#5d727c" font-size="9">GAONA-HUB / HUD 0.6</text>
  </g>
</svg>
